<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول لوحة التفعيلات · FB ULTIMATE</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="center">
  <div class="card login">
    <h1><span class="accent">FB ULTIMATE</span> · لوحة التفعيلات</h1>
    {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label>اسم المستخدم</label>
      <input name="username" autocomplete="username" required>
      <label>كلمة المرور</label>
      <input name="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">دخول</button>
    </form>
    <p class="dim">محمي بجلسة موقّعة · مفيش أي توكن بيظهر في الصفحة</p>
  </div>
</body>
</html>
